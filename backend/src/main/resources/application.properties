spring.application.name=Matrimony

spring.datasource.url=jdbc:mysql://localhost:3306/matrimony

spring.datasource.username=root
server.port=5454
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.hbm2ddl.auto=update
logging.level.org.hibernate.tool.hbm2ddl=DEBUG

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==== JWT ====
# Change this secret before deploying to production. Must be a long, random,
# base64-safe string (HS256 needs >= 256 bits).
app.jwt.secret=${JWT_SECRET}
# Token validity in milliseconds (24 hours)
app.jwt.expiration-ms=86400000


# ---- Membership / Razorpay ----
# Get these from the Razorpay dashboard (use TEST keys while developing).
# Prefer environment variables in real deployments:
#   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET
# The secret is used only on the backend and is never sent to React.
app.razorpay.key-id=${RAZORPAY_KEY_ID}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# ---- OTP / Twilio (rotate the old hardcoded token in the Twilio console!) ----
# Prefer environment variables in real deployments.
app.twilio.account-sid=
app.twilio.auth-token=
app.twilio.from-number=
app.otp.dev-mode=true
